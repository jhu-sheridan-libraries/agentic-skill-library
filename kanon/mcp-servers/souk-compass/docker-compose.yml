services:
  solr:
    # Patch-pinned for reproducible npm package initialization.
    image: solr:10.0.0
    container_name: souk-compass-solr
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/var/solr
      - ./solr/configset:/opt/solr/server/solr/configsets/souk-compass
    environment:
      ZK_HOST: zoo:2181
      # kNN queries inline the full query vector into the request URI. At
      # vectorDimension=1024 (see solr/schema.xml) that is ~22KB, well over
      # Jetty's 8192-byte default, which fails every vector and hybrid search
      # with HTTP 414. Headroom is for larger topK, filter queries, and any
      # future dimension increase.
      SOLR_OPTS: "-Dsolr.jetty.request.header.size=65536"
    depends_on:
      zoo:
        condition: service_healthy

  zoo:
    # Patch-pinned for reproducible npm package initialization.
    image: zookeeper:3.9.3
    container_name: souk-compass-zoo
    ports:
      - "2181:2181"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
    volumes:
      - zoo-data:/data
      - zoo-datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  solr-data:
  zoo-data:
  zoo-datalog:
