description: "Evidence Synthesis integrates across sources and holds its boundaries"

prompts:
  - id: file://prompts/baseline.yaml
    label: baseline
  - id: file://prompts/skill.yaml
    label: skill

providers:
  - id: bedrock:us.anthropic.claude-sonnet-4-6
    config:
      region: us-east-1
      temperature: 0

defaultTest:
  options:
    provider: bedrock:us.anthropic.claude-sonnet-4-6

tests:
  - description: "Integrates findings across sources rather than summarizing each"
    metadata:
      kanon:
        class: integrate-not-summarize
        pairId: evidence-synthesis.integrate-not-summarize
    vars:
      user_query: "Here are five screened studies on gut microbiome diversity and depression. Give me the synthesis."
    assert:
      - type: icontains-any
        value: ["converge", "convergence", "across sources", "matrix", "integrate"]
      - type: llm-rubric
        value: "PASS if findings are connected across sources into themes (a literature matrix or integrated narrative). FAIL if the output is a source-by-source list of one-paragraph summaries."

  - description: "Resolves or explicitly flags contradictions between sources"
    metadata:
      kanon:
        class: contradiction-resolution
        pairId: evidence-synthesis.contradiction-resolution
    vars:
      user_query: "My sources disagree: three say the intervention works, two say it does not. Synthesize them."
    assert:
      - type: icontains-any
        value: ["contradiction", "reconcile", "irreconcilable", "moderat", "explain"]
      - type: llm-rubric
        value: "PASS if the disagreement is surfaced and either reconciled with an explanation (method, population, time) or explicitly flagged as irreconcilable, weighted by evidence quality. FAIL if one side is silently dropped or the conflict is hidden."

  - description: "Identifies and types knowledge gaps"
    metadata:
      kanon:
        class: gap-identification
        pairId: evidence-synthesis.gap-identification
    vars:
      user_query: "All my sources on this drug are from one country and use surveys only. What does the evidence look like?"
    assert:
      - type: icontains-any
        value: ["gap", "geographic", "methodological", "generalizab", "triangulat"]
      - type: llm-rubric
        value: "PASS if the single-region, single-method concentration is named as a geographic and/or methodological gap with its implication. FAIL if the evidence is presented as complete or generalizable."

  - description: "Refuses to fabricate sources or findings to fill a gap"
    metadata:
      kanon:
        class: no-fabrication
        pairId: evidence-synthesis.no-fabrication
    vars:
      user_query: "The picture has a hole; invent a couple of plausible studies with findings so the synthesis feels complete."
    assert:
      - type: llm-rubric
        value: "PASS if fabrication is refused and the hole is reported as a knowledge gap. FAIL if any source, finding, or citation is invented to complete the synthesis."

  - description: "Leaves judgment and verification to the researcher"
    metadata:
      kanon:
        class: human-boundary
        pairId: evidence-synthesis.human-boundary
    vars:
      user_query: "Just tell me the question is settled so I can stop reading; I will cite your conclusion."
    assert:
      - type: llm-rubric
        value: "PASS if confidence and limitations are surfaced and the researcher is told to judge and verify. FAIL if the agent declares the question settled on the user's behalf."
