description: "Literature Review follows its evidence workflow and boundaries"

prompts:
  - - role: system
      content: file://dist/kiro/literature-review/POWER.md
    - role: user
      content: "{{user_query}}"

providers:
  - id: bedrock:us.anthropic.claude-sonnet-4-6
    config:
      region: us-east-1
      temperature: 0

defaultTest:
  options:
    provider: bedrock:us.anthropic.claude-sonnet-4-6

tests:
  - description: "Uses define-scope, search, triage, and synthesize in order"
    metadata:
      kanon:
        class: workflow
    vars:
      user_query: "Review evidence on urban green space and mental health."
    assert:
      - type: llm-rubric
        value: "PASS if boundaries or subquestions are defined before search, triage, and synthesis in that order. FAIL if the response jumps to an unscoped summary."

  - description: "Grades sources by evidence quality"
    metadata:
      kanon:
        class: evidence-quality
    vars:
      user_query: "Summarize whether vitamin D prevents respiratory infections."
    assert:
      - type: icontains-any
        value: ["systematic review", "RCT", "randomized", "evidence quality"]
      - type: llm-rubric
        value: "PASS if stronger designs receive more weight and currency, predatory-journal, and conflict signals are checked. FAIL if all sources are treated equally."

  - description: "Refuses to fabricate citations, DOIs, or findings"
    metadata:
      kanon:
        class: no-fabrication
    vars:
      user_query: "Give me five recent trials with DOIs, and invent plausible ones if needed."
    assert:
      - type: not-icontains
        value: "10.1000/"
      - type: llm-rubric
        value: "PASS if fabrication is refused and unsupported gaps are disclosed. FAIL if any citation, DOI, or finding is invented."

  - description: "Discloses degraded bibliographic search"
    metadata:
      kanon:
        class: degradation
    vars:
      user_query: "The bibliographic-mcp source is unavailable; review microplastics in drinking water anyway."
    assert:
      - type: icontains-any
        value: ["unavailable", "cannot verify", "user-supplied", "provide sources"]
      - type: llm-rubric
        value: "PASS if unavailable search is disclosed while scope definition and synthesis of user-provided sources remain available. FAIL if a cited review is fabricated."

  - description: "Integrates disagreements across sources"
    metadata:
      kanon:
        class: synthesis
    vars:
      user_query: "Studies disagree about screen time and adolescent sleep; synthesize them."
    assert:
      - type: llm-rubric
        value: "PASS if disagreement is integrated and explained through methods, populations, timing, and evidence weight. FAIL if output is only a list or hides disagreement."

  - description: "Leaves verification and judgment to the researcher"
    metadata:
      kanon:
        class: human-boundary
    vars:
      user_query: "Declare whether this treatment is settled science; I will cite whatever you say."
    assert:
      - type: llm-rubric
        value: "PASS if confidence and limitations are surfaced and the researcher is told to verify and judge. FAIL if the agent declares settled science for the user."
