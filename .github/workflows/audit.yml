name: Security Audit

on:
  schedule:
    # Every Monday at 07:00 UTC — early enough to act on findings before the week fills up
    - cron: "0 7 * * 1"
  # Also run when dependencies change
  push:
    branches: [main]
    paths:
      - "kanon/package.json"
      - "kanon/bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            kanon/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('kanon/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install
        working-directory: kanon

      - name: Run bun audit
        id: audit
        working-directory: kanon
        run: |
          bun audit --json > audit-results.json 2>/dev/null || true

          # Strip ANSI codes from text output for reliable parsing
          bun audit 2>&1 | sed 's/\x1b\[[0-9;]*m//g' > audit-text.txt || true

          # Count high/critical from JSON
          TOTAL_HIGH=$(jq '[to_entries[].value[] | select(.severity == "high" or .severity == "critical")] | length' audit-results.json 2>/dev/null || echo 0)

          # Determine how many high/critical findings are actionable.
          # Suppressed dependency chains (not shipped or no fix available):
          #   - promptfoo: eval framework (devDependency, never shipped)
          #   - @codecov: coverage plugin (devDependency, never shipped)
          #   - js-yaml (direct + gray-matter): no upstream fix for 3.x/4.x !!omap DoS
          #     (only fixed in js-yaml 5.x which gray-matter can't use). We control all
          #     YAML input (local artifact files). Tracked: GHSA-5p4m-2wfm-xmqj.
          #
          # Strategy: for each vulnerability package block in the text output, check
          # whether ALL dependency paths go through suppressed packages. If yes,
          # the entire block's high/critical count is suppressed.
          ACTIONABLE=$(awk '
            BEGIN { suppressed_high = 0 }
            # Package header line (starts at column 1, not indented)
            /^[a-zA-Z@][^ ]/ {
              if (pkg != "" && has_high && !has_unsuppressed) suppressed_high += high_count
              pkg = $1; has_high = 0; high_count = 0; has_unsuppressed = 0
            }
            # Dependency path lines (indented, contain package names with arrows)
            /^  [a-zA-Z@(]/ {
              line = $0
              # Suppressed if line mentions promptfoo, @codecov, or gray-matter
              if (line ~ /promptfoo/ || line ~ /@codecov/ || line ~ /gray-matter/) next
              # js-yaml direct dep: no upstream fix available, suppress
              if (line ~ /\(direct dependency\)/ && pkg ~ /^js-yaml/) next
              # Any other path means this package has an actionable chain
              if (line !~ /^  (high|critical|moderate|low):/) has_unsuppressed = 1
            }
            # Vulnerability severity lines
            /^  (high|critical):/ { has_high = 1; high_count++ }
            END {
              if (pkg != "" && has_high && !has_unsuppressed) suppressed_high += high_count
              actionable = '"$TOTAL_HIGH"' - suppressed_high
              if (actionable < 0) actionable = 0
              print actionable
            }
          ' audit-text.txt)

          echo "high_count=$ACTIONABLE" >> "$GITHUB_OUTPUT"

          if [ "$ACTIONABLE" -eq 0 ] && [ "$TOTAL_HIGH" -gt 0 ]; then
            echo "::warning::Found $TOTAL_HIGH high/critical vulnerabilities, all in suppressed deps (promptfoo, @codecov, js-yaml with no upstream fix). Not blocking."
          elif [ "$ACTIONABLE" -gt 0 ]; then
            echo "::error::Found $ACTIONABLE actionable high/critical vulnerabilities."
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-results
          path: kanon/audit-results.json
          retention-days: 30

      - name: Fail on high or critical vulnerabilities
        if: steps.audit.outputs.high_count > 0
        run: |
          echo "::error::Found high or critical vulnerabilities. Review audit-results artifact."
          exit 1

  secret-scan:
    name: Secret scan (knowledge artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: >
            --source .
            --config .gitleaks.toml
            --redact
            --exit-code 1

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    # Only on schedule and push to main — not on every PR
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # publish_results requires the workflow to run from the repository's
          # default branch; setting it to false avoids the HTTP 400 "workflow
          # verification failed" error while still generating the SARIF report
          # for upload to the GitHub Security tab below.
          publish_results: false

      - name: Upload Scorecard results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
