name: CI

on:
  pull_request:
    paths:
      - "kanon/knowledge/**"
      - "kanon/templates/**"
      - "kanon/evals/**"
      - "kanon/src/**"
      - "kanon/scripts/**"
      - "kanon/package.json"
      - "kanon/bun.lock"
  workflow_dispatch:
    inputs:
      skip-lint:
        description: "Skip lint step"
        type: boolean
        default: false
      skip-typecheck:
        description: "Skip type check step"
        type: boolean
        default: false
      skip-test:
        description: "Skip test step"
        type: boolean
        default: false
      skip-validate:
        description: "Skip artifact validation"
        type: boolean
        default: false
      skip-security:
        description: "Skip security scan"
        type: boolean
        default: false
      skip-build:
        description: "Skip build + dist check"
        type: boolean
        default: false

permissions:
  contents: read

# Cancel in-progress runs for the same PR — only the latest push matters.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast checks: lint + typecheck (no test overhead) ──
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanon
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            kanon/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('kanon/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Lint
        if: ${{ !inputs.skip-lint }}
        run: bun run lint

      - name: Type check
        if: ${{ !inputs.skip-typecheck }}
        run: bun x tsc --noEmit

  # ── Test suite + coverage ──
  test:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-test }}
    defaults:
      run:
        working-directory: kanon
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            kanon/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('kanon/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        if: ${{ !inputs.skip-test }}
        uses: codecov/codecov-action@v7
        with:
          files: kanon/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Validate + build + dist drift check ──
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            kanon/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('kanon/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Validate artifacts
        if: ${{ !inputs.skip-validate }}
        run: bun run dev validate

      - name: Security scan artifacts
        if: ${{ !inputs.skip-security }}
        run: bun run dev validate --security

      - name: Build
        if: ${{ !inputs.skip-build }}
        run: bun run dev build

      - name: Generate catalog
        if: ${{ !inputs.skip-build }}
        run: bun run dev catalog generate

      - name: Export static catalog
        if: ${{ !inputs.skip-build }}
        run: bun run dev catalog export --output /tmp/web-export

      - name: Upload dist artifact
        if: ${{ !inputs.skip-build }}
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: |
            kanon/dist/
            kanon/catalog.json
            kanon/bridge/mcp-server.cjs
          retention-days: 30

      - name: Verify MCP bridge compiles
        if: ${{ !inputs.skip-build }}
        run: |
          bun run build:bridge
          node bridge/mcp-server.cjs --version || true

  # ── Generated-artifact drift check ──
  # skills/ and bridge/mcp-server.cjs are committed build outputs generated
  # from knowledge/ by `build:skills` and `build:bridge`. They can silently
  # go stale if someone edits knowledge/ (or the bridge/template source) and
  # forgets to regenerate. Regenerate here and fail if the working tree drifts.
  generated-artifacts-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanon
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            kanon/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('kanon/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Regenerate committed plugin skills
        run: bun run build:skills

      - name: Regenerate committed MCP bridge
        run: bun run build:bridge

      - name: Fail if committed artifacts drifted from source
        run: |
          # Compare committed skills/ and bridge against freshly generated output.
          if [ -n "$(git status --porcelain skills bridge)" ]; then
            echo "::error::Committed generated artifacts are out of sync with source."
            echo "::error::Run 'bun run build:skills && bun run build:bridge' in kanon/ and commit the result."
            echo "--- drift ---"
            git status --short skills bridge
            git diff -- skills bridge
            exit 1
          fi
          echo "✓ skills/ and bridge/mcp-server.cjs are in sync with source."

  # ── Changelog fragment enforcement ──
  changelog-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changelog fragment
        run: |
          # Fetch the base branch so we can diff against it
          git fetch origin ${{ github.base_ref }} --depth=1

          # Get list of changed files in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Check if any source/artifact files changed (not just docs/CI)
          SRC_CHANGED=$(echo "$CHANGED" | grep -E '^kanon/(src|knowledge|templates|scripts)/' || true)

          if [ -z "$SRC_CHANGED" ]; then
            echo "No source files changed — changelog fragment not required."
            exit 0
          fi

          # Check for skip-changelog label
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q "skip-changelog"; then
            echo "skip-changelog label found — skipping enforcement."
            exit 0
          fi

          # Check if a changelog fragment was added
          FRAGMENT=$(echo "$CHANGED" | grep '^kanon/changes/.*\.md$' || true)

          if [ -z "$FRAGMENT" ]; then
            echo "::error::Source files changed but no changelog fragment found in kanon/changes/."
            echo "::error::Run 'bun run changelog:new --type <added|changed|fixed|...> --message \"description\"' to create one."
            echo "::error::Or add the 'skip-changelog' label to bypass this check."
            exit 1
          fi

          echo "✓ Changelog fragment found: $FRAGMENT"

  # ── Eval ──
  # The LLM eval suite lives in .github/workflows/eval.yml and is manual
  # dispatch only. It calls paid providers and previously re-ran a full
  # install + build on every PR touching kanon/src/**. Per ADR-0022 the LLM
  # rubric layer is a maintainer review tool, not a PR gate.
  #
  # The deterministic Kiro progressive-steering rubric (no model calls) stays
  # on pull_request in eval-kiro-progressive-steering.yml.
