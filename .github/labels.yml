# ── workflow / status ──────────────────────────────────────────────────────
- name: "needs: adr"
  color: "e99695"
  description: "Architectural decision to document in docs/adr/"
- name: "needs: changelog"
  color: "e99695"
  description: "Missing a changes/ fragment"
- name: "needs: triage"
  color: "ededed"
  description: "Awaiting first review"
- name: "blocked"
  color: "000000"
  description: "Blocked on external work or decision"
- name: "breaking-change"
  color: "b60205"
  description: "Backward-incompatible; SemVer major"
- name: "good first issue"
  color: "7057ff"
  description: "Approachable for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Maintainer wants outside help"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Out of scope / declined"
