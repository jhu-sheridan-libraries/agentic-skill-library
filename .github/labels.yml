# GitHub label definitions for this repository.
#
# This is the single source of truth for the label SET (name / color /
# description). It is applied by .github/workflows/sync-labels.yml on every
# push to main that touches this file, via crazy-max/ghaction-github-labeler.
#
# Distinct from .github/labeler.yml, which path-auto-ASSIGNS a subset of these
# labels to PRs (actions/labeler). This file DEFINES them.
#
# Editing: change a label here and merge to main; the workflow reconciles the
# repo to match. `from_name` renames an existing label without losing its use.

# ── type: what kind of change ──────────────────────────────────────────────
- name: "type: feature"
  color: "0e8a16"
  description: "New capability or artifact"
- name: "type: fix"
  color: "d73a4a"
  description: "Bug fix"
- name: "type: docs"
  color: "0075ca"
  description: "Docs, README, ADRs, changelog prose"
- name: "type: refactor"
  color: "5319e7"
  description: "Internal change, no behavior shift"
- name: "type: test"
  color: "fbca04"
  description: "Tests only"
- name: "type: chore"
  color: "cfd3d7"
  description: "Build, deps, tooling, release plumbing"
- name: "type: security"
  color: "b60205"
  description: "Vulnerability or hardening"

# ── area: which part of the codebase ───────────────────────────────────────
- name: "area: cli"
  color: "1d76db"
  description: "kanon command surface (Commander)"
- name: "area: adapters"
  color: "1d76db"
  description: "Per-harness compilers in src/adapters/"
- name: "area: schemas"
  color: "1d76db"
  description: "Zod schemas / type system"
- name: "area: parser"
  color: "1d76db"
  description: "Frontmatter + body parsing"
- name: "area: templates"
  color: "1d76db"
  description: "Nunjucks .njk output templates"
- name: "area: backends"
  color: "1d76db"
  description: "Install/publish backends (GitHub, S3, HTTP, local)"
- name: "area: catalog"
  color: "1d76db"
  description: "Catalog generation / catalog.json"
- name: "area: knowledge"
  color: "1d76db"
  description: "Knowledge artifacts under knowledge/"
- name: "area: collections"
  color: "1d76db"
  description: "Collection manifests / membership"
- name: "area: bridge"
  color: "1d76db"
  description: "MCP bridge (bridge/mcp-server.cjs)"
- name: "area: guild"
  color: "1d76db"
  description: "Manifest-driven distribution & sync"
- name: "area: ci"
  color: "1d76db"
  description: "GitHub Actions, release pipeline"

